[project]
name = "analyst-agent"
version = "0.1.0"
description = "Stock analyst agentic AI"
authors = [
    {name = "Jacob Cohen", email = "79770350+jacob187@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "edgartools>=5.61.1",
    "langchain==1.3.9",
    "langchain-google-genai==4.2.2",
    "langchain-openai==1.1.14",
    "langchain-anthropic==1.4.6",
    "langchain-tavily==0.2.18",
    "langgraph==1.2.4",
    "tavily-python==0.7.23",
    "yfinance==1.3.0",
    "pydantic==2.13.3",
    "aiosqlite==0.22.1",
    "python-dotenv==1.2.2",
    "langsmith==0.8.18",
    "pyjwt[crypto]>=2.15.0",
    "cachetools>=5.3",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "openinference-instrumentation-langchain==0.1.86",
    "openinference-semantic-conventions==0.1.44",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = [
    "network: hits live external services (no API keys); excluded by default, run with -m network",
    "eval_unit: pure logic tests, no API keys needed",
    "eval_fast: single LLM call each (router/planner/synthesizer)",
    "eval_tools: individual tool validation (requires API keys)",
    "eval_quality: LLM-as-judge scoring (requires API keys)",
    "eval_e2e: full agent invocations (requires API keys)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "fpdf2==2.8.8",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "agents"]
