# Benchmark question set. Editing this file changes the question-set hash, so
# runs made before and after the edit are not comparable (judge refuses them).
#
# Categories:
#   filing_lookup    - risk factors, MD&A, balance sheet from 10-K / 10-Q
#   multi_step       - combines filings + financials + technicals
#   material_events  - 8-K disclosures
#   technicals       - price action and indicators
#   market_news      - web research / macro context (needs a Tavily key to be answerable)
- id: aapl-risk-factors
  ticker: AAPL
  category: filing_lookup
  question: What are the most significant risk factors Apple discloses in its latest 10-K, and which of them are new or have changed in emphasis compared with the prior year?

